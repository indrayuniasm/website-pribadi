<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Link - GitHub Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-6">

    <div class="glass p-8 rounded-[2rem] shadow-2xl max-w-md w-full text-center">
        <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent mb-2">IMG UPLOADER</h1>
        <p class="text-sm text-slate-400 mb-8">Simpan gambar langsung ke GitHub & Netlify</p>
        
        <div class="space-y-5">
            <div class="group relative border-2 border-dashed border-slate-700 rounded-2xl p-8 hover:border-indigo-500 transition-all cursor-pointer bg-slate-800/30">
                <input type="file" id="fileInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                <div class="space-y-3">
                    <div class="mx-auto w-12 h-12 rounded-full bg-indigo-500/10 flex items-center justify-center group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </div>
                    <span class="block text-slate-300 font-semibold text-sm" id="fileName">Pilih Gambar</span>
                </div>
            </div>
            
            <button id="btnUpload" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-500/20 transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                GENERATE LINK
            </button>
        </div>

        <div id="resultArea" class="mt-8 pt-8 border-t border-slate-800 text-left hidden">
            <label class="text-[10px] font-bold text-indigo-400 tracking-[0.2em] uppercase block mb-3">Link Gambar Anda</label>
            <div class="flex gap-2">
                <input type="text" readonly id="resultLink" class="w-full p-4 bg-slate-900/50 border border-slate-700 rounded-xl text-sm font-medium text-slate-200 outline-none focus:border-indigo-500">
                <button id="btnCopy" class="bg-slate-700 hover:bg-slate-600 text-white px-5 rounded-xl text-xs font-bold transition">SALIN</button>
            </div>
            
            <div class="mt-6">
                <label class="text-[10px] font-bold text-slate-500 tracking-[0.2em] uppercase block mb-3">Preview</label>
                <img id="previewImg" src="" class="w-full h-48 object-cover rounded-2xl border border-slate-800 shadow-inner">
            </div>
        </div>
    </div>

    <script>
        // ISI KONFIGURASI GITHUB KAMU DI SINI
        const GITHUB_TOKEN = "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"; // Ganti dengan token baru yang aman!
        const REPO_OWNER = "indrayuniasm"; 
        const REPO_NAME = "website-pribadi"; 
        const BRANCH = "main"; 

        const fileInput = document.getElementById('fileInput');
        const btnUpload = document.getElementById('btnUpload');
        const btnCopy = document.getElementById('btnCopy');
        const fileNameText = document.getElementById('fileName');
        const resultArea = document.getElementById('resultArea');
        const resultLink = document.getElementById('resultLink');
        const previewImg = document.getElementById('previewImg');

        // Menangani perubahan file (termasuk jika user membatalkan pilihan)
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                fileNameText.innerText = e.target.files[0].name;
            } else {
                fileNameText.innerText = "Pilih Gambar";
            }
        });

        // Fungsi mengubah file gambar menjadi format Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        btnUpload.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Pilih file dulu!");

            btnUpload.disabled = true;
            btnUpload.innerText = "SEDANG MENGUPLOAD KE GITHUB...";

            // Membuat nama file unik
            const extension = file.name.split('.').pop();
            const randomString = Math.random().toString(36).substring(2, 8);
            const newName = `img-${Date.now()}-${randomString}.${extension}`;
            const filePath = `gambar/${newName}`; 

            try {
                const base64Content = await toBase64(file);

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload otomatis: ${newName}`,
                        content: base64Content,
                        branch: BRANCH
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // 1. Mengambil domain Netlify aktif tempat website diakses
                    const myDomain = window.location.origin;
                    
                    // 2. Format link final menggunakan domain Netlify kamu
                    const netlifyLink = `${myDomain}/${filePath}`; 
                    resultLink.value = netlifyLink;

                    // 3. Menggunakan GitHub Raw Link khusus untuk preview instan
                    const githubRawLink = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${filePath}`;
                    previewImg.src = githubRawLink;

                    // Tampilkan area komponen hasil
                    resultArea.classList.remove('hidden');
                } else {
                    alert("Gagal Upload: " + data.message);
                }
            } catch (err) {
                alert("Terjadi kesalahan sistem!");
                console.error(err);
            } finally {
                btnUpload.disabled = false;
                btnUpload.innerText = "GENERATE LINK";
            }
        });

        btnCopy.addEventListener('click', () => {
            if (!resultLink.value) return;
            resultLink.select();
            navigator.clipboard.writeText(resultLink.value);
            alert("Link gambar berhasil disalin!");
        });
    </script>
</body>
</html>
